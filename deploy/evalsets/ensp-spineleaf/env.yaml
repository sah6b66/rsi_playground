# ============================================================
# eNSP Pro spine-leaf 真实环境（S11 验证，2026-11-12 勘察值）
# 平台 WEB 入口 https://192.168.56.102:8443（预建拓扑，不编排构建）
# 管理网 192.168.96.0/24 经每台设备 GE1/0/10（OOB，禁止注入故障）
# ============================================================
name: ensp-spineleaf
backend: ensp-pro

devices:
  - {name: Spine-01, type: vrp, version: "V300R025C10", config: configs/Spine-01.cfg}
  - {name: Spine-02, type: vrp, version: "V300R025C10", config: configs/Spine-02.cfg}
  - {name: Leaf-01, type: vrp, version: "V300R025C10", config: configs/Leaf-01.cfg}
  - {name: Leaf-02, type: vrp, version: "V300R025C10", config: configs/Leaf-02.cfg}
  - {name: Leaf-03, type: vrp, version: "V300R025C10", config: configs/Leaf-03.cfg}
  - {name: Leaf-04, type: vrp, version: "V300R025C10", config: configs/Leaf-04.cfg}

# 全互联（勘察实值）：Leaf-XX GE1/0/1 ↔ Spine-01 GE1/0/XX；GE1/0/2 ↔ Spine-02
topology:
  links:
    - {endpoints: ["Leaf-01:GE1/0/1", "Spine-01:GE1/0/1"], type: ethernet}
    - {endpoints: ["Leaf-01:GE1/0/2", "Spine-02:GE1/0/1"], type: ethernet}
    - {endpoints: ["Leaf-02:GE1/0/1", "Spine-01:GE1/0/2"], type: ethernet}
    - {endpoints: ["Leaf-02:GE1/0/2", "Spine-02:GE1/0/2"], type: ethernet}
    - {endpoints: ["Leaf-03:GE1/0/1", "Spine-01:GE1/0/3"], type: ethernet}
    - {endpoints: ["Leaf-03:GE1/0/2", "Spine-02:GE1/0/3"], type: ethernet}
    - {endpoints: ["Leaf-04:GE1/0/1", "Spine-01:GE1/0/4"], type: ethernet}
    - {endpoints: ["Leaf-04:GE1/0/2", "Spine-02:GE1/0/4"], type: ethernet}

ssh_access:
  Spine-01: {ip: 192.168.96.11, port: 22, username: CLI_Agent, password: "Adm@1234"}
  Spine-02: {ip: 192.168.96.12, port: 22, username: CLI_Agent, password: "Adm@1234"}
  Leaf-01: {ip: 192.168.96.21, port: 22, username: CLI_Agent, password: "Adm@1234"}
  Leaf-02: {ip: 192.168.96.22, port: 22, username: CLI_Agent, password: "Adm@1234"}
  Leaf-03: {ip: 192.168.96.23, port: 22, username: CLI_Agent, password: "Adm@1234"}
  Leaf-04: {ip: 192.168.96.24, port: 22, username: CLI_Agent, password: "Adm@1234"}

ready_checks:
  - type: ssh_reachable

external_deps: []
