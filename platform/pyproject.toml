[project]
name = "rsi-playground"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlmodel>=0.0.16",
    "sqlalchemy>=2.0",
    "gitpython>=3.1",
    "structlog>=24.1",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
    "httpx>=0.27",
    "fastapi>=0.111",
    "scipy>=1.12",
    "docker>=7.0",
    "pyyaml>=6.0.3",
    "python-multipart>=0.0.33",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["rsi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "sim: simulation-backend cases (S11+, expected to skip until real backends)",
    "e2e: compose/playwright acceptance cases (expected to skip until E2E phase)",
]
