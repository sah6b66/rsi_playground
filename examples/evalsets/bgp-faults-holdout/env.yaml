# ============================================================
# 评测集环境定义文件（三件套之一）
# ============================================================
# 定义仿真网络环境：设备、拓扑、SSH 登录信息、就绪检查。
# 任务以设备名引用设备（不含 IP）；换部署环境只改 backend 和 ssh_access。
#
# 文件位置：evalsets/<evalset_id>/env.yaml
# 站点覆盖：env.<site>.yaml 可覆盖 backend 和 ssh_access（仅此两项）
# ============================================================

# 环境名（任务 prepare 的 call_api 参数中引用）
name: bgp-basic-env

# 仿真后端类型
# 可选值：ensp-pro | pnetlab | containerlab | fake
# fake = 内存虚拟设备（离线测试用）
backend: ensp-pro

# 设备清单（任务和断言以 name 引用）
devices:
  - name: R1                          # 设备名（全局唯一，任务以此引用）
    type: vrp                         # 设备类型：vrp（华为）| ce | ios（思科）
    version: "8.180"                  # 软件版本（可选，供记录）
    config: configs/R1.cfg            # 初始配置文件（相对本目录）

  - name: R2
    type: vrp
    version: "8.180"
    config: configs/R2.cfg

# 组网拓扑（设备间链路）
topology:
  links:
    - endpoints: [R1:GE0/0/1, R2:GE0/0/1]   # 设备名:接口名
      type: ethernet                            # ethernet | serial

# 设备 SSH 登录信息
# password 和 password_ref 二选一（不可同时填！）
#   password: 明文密码（仅限实验网）
#   password_ref: CredentialStore 中的凭证名（推荐）
ssh_access:
  R1:
    ip: 10.101.1.1
    port: 22
    username: admin
    password: Lab@123                 # 实验网明文密码（生产请用 password_ref）
  R2:
    ip: 10.101.1.2
    port: 22
    username: admin
    password_ref: dev-cred           # 引用 CredentialStore 中的凭证

# 就绪检查（缺省 = 全部设备 SSH 可达即就绪）
ready_checks:
  - type: ssh_reachable               # SSH 可达检查
  - type: cli_match                   # CLI 输出匹配检查
    device: R2
    cli: display ospf peer
    expect: Full                      # 期望输出中包含的字符串

# 外部配置 API 端点（可选，供 prepare 的 call_api 动作使用）
config_apis: {}
  # cfg-api:
  #   base_url: http://10.10.0.5:8080
  #   auth_ref: cred-cfg-api          # CredentialStore 凭证引用
  #   timeout_s: 60

# 外部依赖声明（P2，可选）
external_deps: []
  # - kind: nms
  #   base_url: http://nms.example.com
  #   auth_ref: cred-nms
